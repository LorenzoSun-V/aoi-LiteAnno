name: Package

# The Windows test build (architecture 12): LiteAnno.exe, one file with Qt and the MSVC
# runtime linked in, so it runs from any folder, a USB drive included, with nothing next to
# it. Every run keeps it as a workflow artifact; a "v*" tag also publishes it as a
# pre-release. liteanno-cli.exe is built and checked here too but not shipped: the people
# who test the build do not use it.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must equal LITEANNO_PINNED_QT_VERSION in cmake/LiteAnnoToolchainPin.cmake.
  QT_VERSION: "6.8.3"
  QT_STATIC_PREFIX: C:\qt-static

jobs:
  windows:
    name: Windows x64 package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Developer shell
        # cl.exe, the Windows SDK and Ninja for the static Qt build, for every later step.
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in "PATH", "INCLUDE", "LIB", "LIBPATH", "WindowsSdkDir", "WindowsSDKVersion", "VCToolsInstallDir", "VCINSTALLDIR") {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          (Get-Command cl.exe).Source

      - name: Static Qt from the cache
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.QT_STATIC_PREFIX }}
          key: qt-static-${{ env.QT_VERSION }}-${{ hashFiles('.github/scripts/build-static-qt.ps1', 'cmake/LiteAnnoToolchainPin.cmake') }}

      - name: Build static Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 150
        run: .github/scripts/build-static-qt.ps1 -Version $env:QT_VERSION -Prefix $env:QT_STATIC_PREFIX -WorkDir "$env:RUNNER_TEMP\qt-src"

      # Saved right away, so a later failing step does not throw the build away.
      - name: Keep the static Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.QT_STATIC_PREFIX }}
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: Qt's Chinese translation
        # qtbase_zh_CN.qm from the official build of the same version; the program carries it.
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --archives qttranslations `
              --outputdir "$env:RUNNER_TEMP\qt-translations"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Licence texts
        # Everything linked into the programs: Qt and its bundled libraries, nlohmann/json
        # (MIT), the OpenCV port (Apache-2.0); SQLite is in the public domain.
        run: |
          $dir = "$env:RUNNER_TEMP\licenses"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "$env:QT_STATIC_PREFIX\licenses\*" $dir
          Copy-Item third_party/nlohmann/LICENSE.MIT "$dir/nlohmann-json-LICENSE.MIT"
          Copy-Item third_party/opencv/LICENSE "$dir/opencv-LICENSE"
          Get-ChildItem $dir | Select-Object -ExpandProperty Name

      - name: Configure
        run: |
          $qm = Get-ChildItem -Recurse "$env:RUNNER_TEMP\qt-translations" -Filter qtbase_zh_CN.qm | Select-Object -First 1
          if (-not $qm) { Write-Error "qtbase_zh_CN.qm not found"; exit 1 }
          cmake --preset windows-msvc -DLITEANNO_BUILD_TESTS=OFF "-DCMAKE_PREFIX_PATH=$env:QT_STATIC_PREFIX" `
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DLITEANNO_QT_TRANSLATION=$($qm.FullName)" `
              "-DLITEANNO_BUNDLED_LICENSES_DIR=$env:RUNNER_TEMP\licenses"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        run: cmake --build --preset windows-msvc --parallel

      - name: Collect the programs
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { git rev-parse --short HEAD }
          $name = "aoi-LiteAnno-$version-win64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build/windows-msvc/Release/LiteAnno.exe $dir
          "PACKAGE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $dir | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Dependency check
        # Each program loads only DLLs that come with Windows: no Qt, no MSVC runtime.
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          $dir = (Resolve-Path "dist/$env:PACKAGE_NAME").Path
          $missing = @()
          foreach ($file in Get-ChildItem -Recurse $dir -Include *.exe, *.dll) {
            $deps = & $dumpbin.FullName /nologo /dependents $file.FullName |
                ForEach-Object { $_.Trim() } | Where-Object { $_ -match '^[\w.\-]+\.dll$' }
            foreach ($dep in $deps) {
              $name = $dep.ToLowerInvariant()
              if ($name -like 'api-ms-*' -or $name -like 'ext-ms-*') { continue }
              if (Test-Path "C:\Windows\System32\$name") { continue }
              $missing += "$($file.Name) -> $dep"
            }
          }
          if ($missing) { $missing | ForEach-Object { Write-Host "missing: $_" }; exit 1 }
          Write-Host "All dependencies found."

      - name: Start-up check
        # Each program, alone in a folder, starts and quits on a machine without Qt on the
        # PATH and finds its image readers, translation and licence texts inside. A hang
        # fails within a minute and leaves Qt's log and a screenshot of the desktop behind.
        timeout-minutes: 5
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $env:QT_DEBUG_PLUGINS = "1"
          New-Item -ItemType Directory -Force startup-check | Out-Null
          function Test-Start($source, $arguments) {
            $exe = Split-Path -Leaf $source
            Write-Host "== $exe $arguments"
            $dir = Join-Path $env:RUNNER_TEMP "alone-$([guid]::NewGuid())"
            New-Item -ItemType Directory $dir | Out-Null
            Copy-Item $source $dir
            $p = Start-Process -FilePath "$dir\$exe" -ArgumentList $arguments -PassThru `
                -RedirectStandardError "startup-check/$exe.stderr.txt" -RedirectStandardOutput "startup-check/$exe.stdout.txt"
            $null = $p.Handle  # keeps the exit code readable after the process ends
            $finished = $p.WaitForExit(60000)
            if (-not $finished) {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save("$PWD\startup-check\$exe.png")
              Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { Write-Host "window: $($_.ProcessName): $($_.MainWindowTitle)" }
              Stop-Process -Id $p.Id -Force
            }
            Get-Content "startup-check/$exe.stdout.txt", "startup-check/$exe.stderr.txt" -ErrorAction SilentlyContinue |
                Select-Object -Last 80
            if (-not $finished) { Write-Error "$exe did not quit within 60 s"; exit 1 }
            if ($p.ExitCode -ne 0) { Write-Error "$exe exited with $($p.ExitCode)"; exit 1 }
          }
          Test-Start "build/windows-msvc/Release/liteanno-cli.exe" "--version"
          Test-Start "build/windows-msvc/Release/liteanno-cli.exe" "--check-single-file"
          Test-Start "dist/$env:PACKAGE_NAME/LiteAnno.exe" "--check-single-file"
          Test-Start "dist/$env:PACKAGE_NAME/LiteAnno.exe" "--smoke-test"

      - name: Keep the start-up check output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: startup-check
          path: startup-check
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: dist/${{ env.PACKAGE_NAME }}

  publish:
    name: Publish pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/LiteAnno.exe --repo "$GITHUB_REPOSITORY" \
            --prerelease --title "$GITHUB_REF_NAME" \
            --notes "测试版：下载 LiteAnno.exe 直接运行，不用安装。"
