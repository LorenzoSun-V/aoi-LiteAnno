name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must equal LITEANNO_PINNED_QT_VERSION in cmake/LiteAnnoToolchainPin.cmake;
  # the configure step fails otherwise.
  QT_VERSION: "6.8.3"

jobs:
  windows:
    name: Windows x64 (MSVC v143)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # TIFF and WebP readers (format spec 9.1).
          modules: qtimageformats
          aqtversion: "==3.3.0"
          cache: true

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc --parallel

      - name: Test
        # On failure, run the failed tests again verbosely so their output is in the log.
        run: |
          ctest --preset windows-msvc
          if ($LASTEXITCODE -ne 0) { ctest --preset windows-msvc --rerun-failed -V; exit 1 }

      - name: Skipped test items
        # Each Qt test item that was skipped (for example a permission test that cannot block
        # a file here), and each program's totals, from the log ctest keeps.
        run: |
          $log = "build/windows-msvc/Testing/Temporary/LastTest.log"
          if (-not (Test-Path $log)) { Write-Error "no ctest log at $log"; exit 1 }
          $lines = Select-String -Path $log -Pattern '^(SKIP   :|Totals:)' | ForEach-Object { $_.Line }
          $lines
          "### Skipped test items (Windows)`n``````n$($lines -join "`n")`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Catalog timings
        # Architecture 14: measured on every run and shown in the run summary.
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          foreach ($count in 5000, 200000) {
            & build/windows-msvc/Release/liteanno_catalog_benchmark.exe "$env:RUNNER_TEMP" $count | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

  linux:
    name: Linux x64 (GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Ninja and OpenGL headers to build; EGL, OpenGL, xkbcommon and fontconfig to run the
          # offscreen start-up test.
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1 libopengl0 libxkbcommon-dev libfontconfig1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtimageformats
          aqtversion: "==3.3.0"
          cache: true

      - name: Install X-AnyLabeling for the round trips
        # Format spec 11: files this program writes are read back by the pinned upstream release.
        run: |
          python3 -m venv "$RUNNER_TEMP/upstream"
          "$RUNNER_TEMP/upstream/bin/pip" install --quiet "x-anylabeling-cvhub==4.2.0"

      - name: Configure
        run: cmake --preset linux-gcc -DLITEANNO_UPSTREAM_PYTHON="$RUNNER_TEMP/upstream/bin/python"

      - name: Build
        run: cmake --build --preset linux-gcc --parallel

      - name: Test
        run: ctest --preset linux-gcc || { ctest --preset linux-gcc --rerun-failed -V; exit 1; }

      - name: Skipped test items
        # Each Qt test item that was skipped, and each program's totals, from ctest's log.
        run: |
          lines=$(grep -E '^(SKIP   :|Totals:)' build/linux-gcc/Testing/Temporary/LastTest.log || true)
          echo "$lines"
          printf '### Skipped test items (Linux)\n```\n%s\n```\n' "$lines" >> "$GITHUB_STEP_SUMMARY"

      - name: Catalog timings
        # Architecture 14: measured on every run and shown in the run summary.
        run: |
          set -o pipefail
          for count in 5000 200000; do
            build/linux-gcc/tests/liteanno_catalog_benchmark "$RUNNER_TEMP" "$count" | tee -a "$GITHUB_STEP_SUMMARY"
          done
